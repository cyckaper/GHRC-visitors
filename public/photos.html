<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GHRC 研究室照片</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 研究室的人從 LINE 點開、多半是手機：格子大、字至少 16px（iPhone 點小於 16px 的欄位會整頁自己放大），不必左右捲。
     五間各一色，值由 /api/labphotos 回的 labs 填進來（跟後台、支援人力表同一套）。 */
  /* 不靠 Tailwind 也排得對（Tailwind 從 CDN 載，現場網路不好時可能還沒到）：寬度含邊框與內距，fieldset 不要預設的框 */
  *, *::before, *::after { box-sizing: border-box; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  legend { padding: 0; }
  :root { --ink: #1c1917; --c301: #047857; --c302: #0369a1; --c303: #6d28d9; --c304: #b45309; --c305: #a21caf; --ccenter: #44403c; }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 5px; z-index: 60; background: linear-gradient(90deg, var(--c301), var(--c302) 25%, var(--c303) 50%, var(--c304) 75%, var(--c305)); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; background: #fafaf9; color: var(--ink); }
  .muted { color: #78716c; font-size: .9rem; }
  .err { color: #b91c1c; }
  .ok { color: #047857; }
  label.f { display: block; font-weight: 600; margin-bottom: .35rem; }
  select, input[type=text] { width: 100%; font-size: 16px; padding: .65rem .75rem; border: 1px solid #d6d3d1; border-radius: .75rem; background: #fff; }
  .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: .5rem; }
  .room { position: relative; display: block; cursor: pointer; }
  .room input { position: absolute; opacity: 0; pointer-events: none; }
  .room span { display: block; text-align: center; padding: .7rem .4rem; border: 2px solid #e7e5e4; border-radius: .9rem; background: #fff; font-size: 16px; line-height: 1.25; }
  .room span small { display: block; font-size: .78rem; color: #78716c; margin-top: .15rem; }
  .room input:checked + span { border-color: var(--tone); background: color-mix(in srgb, var(--tone) 10%, #fff); font-weight: 600; }
  .room input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--tone) 45%, #fff); }
  .pick { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; padding: 1rem; border-radius: 1rem; background: #1c1917; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
  .pick[aria-disabled=true] { background: #a8a29e; cursor: progress; }
  .bar { height: .5rem; border-radius: 999px; background: #e7e5e4; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: #047857; transition: width .2s; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); gap: .5rem; }
  .thumbs figure { position: relative; margin: 0; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: .6rem; background: #e7e5e4; }
  .thumbs button { position: absolute; top: -.4rem; right: -.4rem; width: 1.9rem; height: 1.9rem; border-radius: 999px; border: 1px solid #d6d3d1; background: #fff; font-size: .9rem; }
  .thumbs figcaption { font-size: .72rem; color: #78716c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body class="min-h-screen">
<main class="max-w-2xl mx-auto px-4 py-8 space-y-5">
  <header>
    <h1 class="text-2xl font-semibold">GHRC 研究室照片</h1>
    <p class="muted mt-1">選好哪一場、哪一間、你的名字，再選照片。可以一次選很多張；傳上來的照片只有中心看得到。</p>
  </header>
  <p id="status" class="muted"></p>

  <form id="form" class="space-y-5" hidden>
    <div>
      <label class="f" for="visit">哪一場</label>
      <select id="visit"></select>
    </div>
    <fieldset>
      <legend class="f">哪一間</legend>
      <div class="rooms" id="rooms"></div>
    </fieldset>
    <div>
      <label class="f" for="by">你的名字</label>
      <input type="text" id="by" autocomplete="name" maxlength="40" placeholder="例如：王小明">
      <p class="muted mt-1">記在這台手機，下次不用再填。</p>
    </div>
    <label class="pick" id="pick" for="files">選照片（可以一次選很多張）</label>
    <input type="file" id="files" accept="image/*" multiple hidden>
    <div id="progressBox" class="space-y-1" hidden>
      <div class="bar"><i id="bar"></i></div>
      <p id="progress" class="text-sm"></p>
    </div>
    <ul id="failed" class="text-sm err list-disc pl-5"></ul>
  </form>

  <section id="summaryBox" class="space-y-1" hidden>
    <h2 class="font-semibold">這一場收到的照片</h2>
    <p id="summary" class="text-sm"></p>
  </section>

  <section id="mineBox" class="space-y-2" hidden>
    <h2 class="font-semibold">這台手機傳的 <span class="muted font-normal">傳錯了按 ✕ 刪掉</span></h2>
    <div class="thumbs" id="mine"></div>
  </section>

  <footer class="muted pt-4 border-t border-stone-200">
    <p>這個網址只給中心內部使用，請不要轉給外面。</p>
  </footer>
</main>

<script type="module">
import { shrinkPhoto } from "/lib/photos.mjs";

const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.search).get("key") || "";
const q = (extra = {}) => `/api/labphotos?${new URLSearchParams({ ...(key ? { key } : {}), ...extra })}`;
const api = (path, init) => fetch(path, { credentials: "same-origin", ...init }).then((r) => r.json().catch(() => ({ ok: false, error: `HTTP ${r.status}`, status: r.status })).then((j) => ({ status: r.status, ...j })));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const status = (msg, cls = "muted") => { $("status").textContent = msg; $("status").className = cls; };
const store = {
  get: (k) => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 私密瀏覽：這一次記得就好 */ } },
};
// 這台手機自己的代號（亂數）：只用來刪自己傳錯的那幾張、看自己傳過的縮圖
let device = store.get("ghrc-photo-device");
if (!/^[a-z0-9]{8,64}$/.test(device)) {
  device = Array.from(crypto.getRandomValues(new Uint8Array(18)), (b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
  store.set("ghrc-photo-device", device);
}
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
// 星期幾照日期字串的年月日算（日期本身沒有時區；拿台北的午夜去問 UTC 會早一天）
const weekday = (d) => { const [y, m, day] = d.split("-").map(Number); return WEEK[new Date(Date.UTC(y, m - 1, day)).getUTCDay()]; };
const ROOM_NAMES = { center: "中心" };

let busy = false;
window.addEventListener("beforeunload", (e) => { if (busy) { e.preventDefault(); e.returnValue = ""; } });

const choices = await api(q());
if (!choices.ok) {
  status(choices.error || "打不開", "err");
} else if (!choices.visits.length) {
  status("還沒有已經到了的參訪：照片等參訪當天再傳。");
} else {
  for (const l of choices.labs || []) if (l.color) document.documentElement.style.setProperty(`--c${l.room}`, l.color);
  // 哪一場：一年一組，新的在前；通告或後台給的連結帶著 #<visit_id> 就直接停在那一場
  const byYear = new Map();
  for (const v of choices.visits) { const y = v.date.slice(0, 4); if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(v); }
  $("visit").innerHTML = [...byYear].map(([y, vs]) => `<optgroup label="${esc(y)}">${vs.map((v) => `<option value="${esc(v.visit_id)}">${esc(`${Number(v.date.slice(5, 7))}/${Number(v.date.slice(8, 10))}（${weekday(v.date)}）${v.today ? "今天 " : ""}${v.org}${v.org_local && v.org_local !== v.org ? `（${v.org_local}）` : ""}`)}</option>`).join("")}</optgroup>`).join("");
  const wanted = decodeURIComponent(location.hash.slice(1));
  $("visit").value = choices.visits.some((v) => v.visit_id === wanted) ? wanted : choices.default;
  // 哪一間：五間＋中心（總體介紹、合照）。記在這台手機
  const labName = (room) => (choices.labs || []).find((l) => l.room === room)?.name_zh || "";
  $("rooms").innerHTML = choices.rooms.map((room) => `<label class="room" style="--tone: var(--c${room})"><input type="radio" name="room" value="${esc(room)}"><span>${room === "center" ? "中心" : esc(room)}<small>${room === "center" ? "總體介紹、合照" : esc(labName(room).replace(/^\d+\s*/, "").replace(/（[^）]*）$/, ""))}</small></span></label>`).join("");
  const savedRoom = store.get("ghrc-photo-room");
  const radio = document.querySelector(`input[name=room][value="${CSS.escape(savedRoom)}"]`);
  if (radio) radio.checked = true;
  $("by").value = store.get("ghrc-photo-by");
  $("form").hidden = false;
  status("");
  $("rooms").addEventListener("change", (e) => store.set("ghrc-photo-room", e.target.value));
  $("by").addEventListener("change", () => store.set("ghrc-photo-by", $("by").value.trim()));
  $("visit").addEventListener("change", refresh);
  refresh(); // 不等它：下面那幾個按鈕的處理要馬上接上（表單已經看得到了）
}

/** 這一場收到幾張、這台手機傳了哪幾張。 */
async function refresh() {
  const visitId = $("visit").value;
  if (!visitId) return;
  const r = await api(q({ visit_id: visitId, device }));
  if (!r.ok || $("visit").value !== visitId) return;
  const s = r.stats || { total: 0, rooms: {}, by: [] };
  $("summaryBox").hidden = false;
  $("summary").textContent = s.total
    ? `共 ${s.total} 張：${Object.entries(s.rooms).sort(([a], [b]) => a.localeCompare(b)).map(([room, n]) => `${ROOM_NAMES[room] || room} ${n} 張`).join("、")}（${s.by.map((b) => `${b.name || "沒寫名字"} ${b.n}`).join("、")}）`
    : "還沒有人傳。";
  $("mineBox").hidden = !r.mine.length;
  $("mine").innerHTML = r.mine
    .slice()
    .reverse()
    .map((p) => `<figure><img loading="lazy" alt="" src="${esc(q({ visit_id: visitId, device, thumb: p.id }))}"><button type="button" data-del="${esc(p.id)}" aria-label="刪掉這一張" title="刪掉這一張">✕</button><figcaption>${esc(ROOM_NAMES[p.room] || p.room)} · ${esc(p.name)}</figcaption></figure>`)
    .join("");
}

$("mine").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-del]");
  if (!b || !confirm("刪掉這一張？")) return;
  const r = await api(q(), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "delete", visit_id: $("visit").value, ids: [b.dataset.del], device }) });
  if (!r.ok) return status(r.error || "沒刪成", "err");
  status("刪掉了。", "ok");
  await refresh();
});

$("pick").addEventListener("click", (e) => {
  if (busy) { e.preventDefault(); return; }
  // 先確定是哪一間、誰拍的，再開相簿（不然選了一大堆才說少填一格）
  const room = document.querySelector("input[name=room]:checked")?.value;
  const by = $("by").value.trim();
  if (!room || !by) {
    e.preventDefault();
    status(!room ? "請先選是哪一間。" : "請先寫你的名字。", "err");
    (!room ? document.querySelector("input[name=room]") : $("by")).focus();
  }
});

$("files").addEventListener("change", async () => {
  const files = [...$("files").files];
  $("files").value = "";
  if (!files.length || busy) return;
  const visitId = $("visit").value;
  const room = document.querySelector("input[name=room]:checked")?.value;
  const by = $("by").value.trim();
  if (!visitId || !room || !by) return status(!room ? "請先選是哪一間。" : "請先寫你的名字。", "err");
  store.set("ghrc-photo-by", by);
  busy = true;
  $("pick").setAttribute("aria-disabled", "true");
  $("failed").innerHTML = "";
  $("progressBox").hidden = false;
  status("");
  let done = 0;
  const failed = [];
  // 一張一張傳：手機的網路是瓶頸，同時傳只會每一張都慢；五間同時在傳也比較不會撞在一起
  for (const [i, f] of files.entries()) {
    const label = `第 ${i + 1}／${files.length} 張`;
    $("progress").textContent = `${label}：整理中……`;
    $("bar").style.width = `${Math.round((i / files.length) * 100)}%`;
    try {
      const shot = await shrinkPhoto(f, { note: (m) => { $("progress").textContent = `${label}：${m}`; } });
      $("progress").textContent = `${label}：上傳中……`;
      await upload(visitId, room, by, shot);
      done += 1;
    } catch (e) {
      failed.push(`${f.name || label}：${e?.message || e}`);
    }
  }
  $("bar").style.width = "100%";
  $("progress").textContent = failed.length ? `傳好了 ${done} 張，${failed.length} 張沒傳成（在下面）。` : `傳好了 ${done} 張，謝謝！`;
  $("progress").className = failed.length ? "text-sm err" : "text-sm ok";
  $("failed").innerHTML = failed.map((m) => `<li>${esc(m)}</li>`).join("");
  busy = false;
  $("pick").removeAttribute("aria-disabled");
  // 這一批傳完了：整場備份到 Drive 一次
  if (done) api(q(), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "done", visit_id: visitId }) });
  await refresh();
});

/** 傳一張；好幾個人同時在傳撞在一起（503）或網路斷一下，等一下自己再傳，最多四次。 */
async function upload(visitId, room, by, shot) {
  for (let attempt = 0; ; attempt += 1) {
    const fd = new FormData();
    fd.append("visit_id", visitId);
    fd.append("room", room);
    fd.append("by", by);
    fd.append("device", device);
    fd.append("name", shot.name);
    fd.append("w", String(shot.w));
    fd.append("h", String(shot.h));
    if (shot.taken) fd.append("taken", shot.taken);
    fd.append("file", shot.file, shot.name);
    fd.append("thumb", shot.thumb, "thumb.jpg");
    let r;
    try {
      r = await api(q(), { method: "POST", body: fd });
    } catch (e) {
      r = { ok: false, retry: true, error: "網路斷了一下" };
    }
    if (r.ok) return r;
    if (!r.retry || attempt >= 3) throw new Error(r.error || "沒傳成");
    await new Promise((res) => setTimeout(res, 800 * 2 ** attempt + Math.random() * 600));
  }
}
</script>
</body>
</html>
