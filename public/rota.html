<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHRC 支援人力表</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 五間各一色，值由 /api/rota 回的 labs 填進來（跟後台與來賓端同一套）。
     表格本身的樣式在 /lib/rota.mjs（後台「設定」分頁也用同一份），這裡只管頁面外框。 */
  :root { --ink: #1c1917; --c301: #047857; --c302: #0369a1; --c303: #6d28d9; --c304: #b45309; --c305: #a21caf; }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 5px; z-index: 60; background: linear-gradient(90deg, var(--c301), var(--c302) 25%, var(--c303) 50%, var(--c304) 75%, var(--c305)); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; background: #fafaf9; color: var(--ink); }
  .muted { color: #78716c; font-size: .86rem; }
  .err { color: #b91c1c; font-size: .9rem; }
</style>
</head>
<body class="min-h-screen">
<main class="max-w-5xl mx-auto px-4 py-8 space-y-4">
  <header>
    <h1 class="text-2xl font-semibold">GHRC 支援人力表</h1>
    <p class="muted mt-1">請在貴室那一格填：<b>接待人員</b>、<b>共需幾分鐘</b>。填完自己會存。</p>
  </header>
  <p id="status" class="muted"></p>
  <div id="rows"></div>
  <footer class="muted pt-4 border-t border-stone-200">
    <p>這個網址只給中心內部使用，請不要轉給外面。</p>
  </footer>
</main>

<script type="module">
import { mountRota, focusVisit } from "/lib/rota.mjs";

const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.search).get("key") || "";
const q = `/api/rota?key=${encodeURIComponent(key)}`;
const api = (path, init) => fetch(path, { credentials: "same-origin", ...init }).then((r) => r.json().catch(() => ({ ok: false, error: `HTTP ${r.status}` })));
const status = (msg, isError) => { $("status").textContent = msg; $("status").className = isError ? "err" : "muted"; };
// 通告裡的連結帶著 #<visit_id>：點進來直接跳到那一場
const wanted = () => decodeURIComponent(location.hash.slice(1));

await mountRota($("rows"), {
  load: () => api(q),
  save: (body) => api(q, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }),
  onStatus: status,
  focus: wanted(),
});
window.addEventListener("hashchange", () => focusVisit($("rows"), wanted()));
</script>
</body>
</html>
