[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/data/**"]

# /api/<name> → 對應的 function（netlify/functions/<name>.mts）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 五間研究室的老師介紹頁 /lab/301 … /lab/305 → lab.html（頁面自己從網址讀房號）
[[redirects]]
  from = "/lab/*"
  to = "/lab.html"
  status = 200

# 各研究室填「這一場誰能支援」的表 /rota → rota.html
[[redirects]]
  from = "/rota"
  to = "/rota.html"
  status = 200

# 專屬網址 visit.healsdesign.org/<visit_id> → 來賓端專頁（既有靜態檔優先）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
