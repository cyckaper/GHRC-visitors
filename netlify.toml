[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/data/**"]

# /api/<name> → 對應的 function（netlify/functions/<name>.mts）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 中心首頁 visit.healsdesign.org/ → center.html（介紹中心，五間研究室各連到 /lab/<房號>）。
# 要 force：根目錄本來就有 index.html（來賓專頁），不 force 的話 Netlify 會直接給 index.html。
# 只比對 "/" 這一個路徑，/<visit_id> 仍然落到最下面那一條。
[[redirects]]
  from = "/"
  to = "/center.html"
  status = 200
  force = true

# 五間研究室的老師介紹頁 /lab/301 … /lab/305 → lab.html（頁面自己從網址讀房號）
[[redirects]]
  from = "/lab/*"
  to = "/lab.html"
  status = 200

# 各研究室填「這一場誰能支援」的表 /rota → rota.html
[[redirects]]
  from = "/rota"
  to = "/rota.html"
  status = 200

# 來訪紀錄 /visits → visits.html（中心首頁的「來訪單位」連過來，一場一段說明）
[[redirects]]
  from = "/visits"
  to = "/visits.html"
  status = 200

# 隱私權政策 /privacy → privacy.html。Google 的 OAuth 同意畫面要發布成「正式版」，Branding 頁一定要填
# 首頁與隱私權政策的連結（在已授權的網域上），填的就是 https://visit.healsdesign.org/privacy
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# 網頁版簡報 /deck → deck.html（每一場都看同一份；頁面與圖是 scripts/web-deck/build.mjs 從母簡報做的）
[[redirects]]
  from = "/deck"
  to = "/deck.html"
  status = 200

# 網頁版簡報不進搜尋引擎（知道連結的人看得到，但不必被搜到）。圖與影片放在每一版自己的資料夾
# （public/assets/deck/<版本>/），內容不會變，瀏覽器可以一直留著；deck.json 每一次都問一下有沒有新版
[[headers]]
  for = "/deck.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/assets/deck/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/data/deck.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 專屬網址 visit.healsdesign.org/<visit_id> → 來賓端專頁（既有靜態檔優先）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
