[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/data/**"]

# /api/<name> → 對應的 function（netlify/functions/<name>.mts）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 中心首頁 visit.healsdesign.org/ → center.html（介紹中心，五間研究室各連到 /lab/<房號>）。
# 要 force：根目錄本來就有 index.html（來賓專頁），不 force 的話 Netlify 會直接給 index.html。
# 只比對 "/" 這一個路徑，/<visit_id> 仍然落到最下面那一條。
[[redirects]]
  from = "/"
  to = "/center.html"
  status = 200
  force = true

# 五間研究室的老師介紹頁 /lab/301 … /lab/305 → lab.html（頁面自己從網址讀房號）
[[redirects]]
  from = "/lab/*"
  to = "/lab.html"
  status = 200

# 各研究室填「這一場誰能支援」的表 /rota → rota.html
[[redirects]]
  from = "/rota"
  to = "/rota.html"
  status = 200

# 專屬網址 visit.healsdesign.org/<visit_id> → 來賓端專頁（既有靜態檔優先）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
